
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارستان | کاریابی افغانستان</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#f2f5f7;color:#243447}
header{background:#075b48;color:white;padding:24px 16px;text-align:center}
header h1{font-size:30px;margin:0 0 8px}
header p{margin:0;font-size:14px}
main{max-width:650px;margin:18px auto;padding:12px}
.card{background:white;padding:18px;margin-bottom:15px;border-radius:13px;box-shadow:0 2px 9px #00000012}
h2{font-size:19px;color:#075b48;margin-top:0}
input,select,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd5d9;border-radius:8px;font-size:15px;font-family:inherit}
button{background:#087b5e;color:white;border:0;border-radius:8px;padding:13px;width:100%;font-size:16px;margin-top:8px;cursor:pointer}
button:hover{background:#075b48}
.job{border:1px solid #e0e6e8;padding:13px;border-radius:9px;margin:10px 0}
.job h3{margin:0 0 8px;color:#075b48}
.small{font-size:13px;color:#667}
footer{text-align:center;padding:20px;color:#667;font-size:12px}
</style>
</head>
<body>
<header>
<h1>کارستان</h1>
<p>پل ارتباطی کارگر و کارفرما در افغانستان</p>
</header>
<main>
<section class="card">
<h2>🔎 جستجوی کار</h2>
<input id="search" placeholder="نام شغل یا شهر را بنویسید">
<button onclick="showJobs()">جستجو</button>
</section>

<section class="card">
<h2>📝 ثبت آگهی استخدام</h2>
<input id="title" placeholder="عنوان شغل">
<input id="city" placeholder="شهر یا ولایت">
<input id="salary" placeholder="معاش پیشنهادی">
<input id="phone" placeholder="شماره تماس">
<textarea id="desc" placeholder="توضیحات شغل"></textarea>
<button onclick="addJob()">ثبت آگهی</button>
</section>

<section class="card">
<h2>💼 فرصت‌های کاری</h2>
<div id="jobs"></div>
</section>

<section class="card">
<h2>📞 ارتباط با کارستان</h2>
<p>برای یافتن کار و معرفی فرصت‌های شغلی از کارستان استفاده کنید.</p>
</section>
</main>
<footer>کارستان © ۲۰۲۶ | همراه کارگران افغانستان</footer>

<script>
let jobs=JSON.parse(localStorage.getItem("karistan_jobs")||"[]");

function showJobs(){
let q=document.getElementById("search").value.trim().toLowerCase();
let list=jobs.filter(j=>(j.title+" "+j.city).toLowerCase().includes(q));
document.getElementById("jobs").innerHTML=list.length?list.map(j=>`
<div class="job">
<h3>${escapeHTML(j.title)}</h3>
<p>📍 ${escapeHTML(j.city)}</p>
<p>💰 ${escapeHTML(j.salary)}</p>
<p>${escapeHTML(j.desc)}</p>
<p>📞 <a href="tel:${encodeURIComponent(j.phone)}">${escapeHTML(j.phone)}</a></p>
</div>`).join(""):"<p>هنوز آگهی‌ای ثبت نشده است.</p>";
}
function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function addJob(){
let title=document.getElementById("title").value.trim();
let city=document.getElementById("city").value.trim();
let phone=document.getElementById("phone").value.trim();
if(!title||!city||!phone){alert("عنوان شغل، شهر و شماره تماس ضروری است.");return;}
jobs.unshift({
title,city,phone,
salary:document.getElementById("salary").value.trim(),
desc:document.getElementById("desc").value.trim()
});
localStorage.setItem("karistan_jobs",JSON.stringify(jobs));
["title","city","phone","salary","desc"].forEach(id=>document.getElementById(id).value="");
showJobs();
alert("آگهی در این گوشی ثبت شد.");
}
showJobs();
</script>
</body>
</html>
