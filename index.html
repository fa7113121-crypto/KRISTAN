
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12664f">
<title>کارستان | کاریابی افغانستان</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f7f4;color:#19352c;font-family:Tahoma,Arial}
header{background:#12664f;color:white;text-align:center;padding:30px 15px}
header h1{font-size:34px;margin:0 0 10px}
main{max-width:750px;margin:20px auto;padding:12px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}
h2{color:#12664f;font-size:20px}
input,textarea,select,button{width:100%;padding:13px;margin:7px 0;border:1px solid #d5e1db;border-radius:9px;font-family:inherit;font-size:15px}
button{background:#12664f;color:white;border:0;font-weight:bold;cursor:pointer}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{flex:1}
.job{padding:14px;border:1px solid #dce9e1;border-radius:10px;margin:12px 0}
.job h3{color:#12664f}
small{color:#718078}
[hidden]{display:none!important}
footer{text-align:center;padding:20px;color:#718078}
</style>
</head>
<body>
<header>
<h1>کارستان</h1>
<p>کاریابی و فرصت‌های شغلی افغانستان</p>
</header>

<main>
<div class="card">
<h2>به کارستان خوش آمدید</h2>
<p>اینجا کارجو و کارفرما به یکدیگر وصل می‌شوند.</p>
<nav>
<button onclick="showPage('jobs')">جستجوی کار</button>
<button onclick="showPage('post')">ثبت آگهی</button>
<button onclick="showPage('register')">ثبت‌نام</button>
</nav>
</div>

<section id="jobs" class="card">
<h2>فرصت‌های شغلی</h2>
<input id="search" placeholder="جستجوی شغل یا شهر" oninput="renderJobs()">
<div id="jobList"></div>
</section>

<section id="post" class="card" hidden>
<h2>ثبت آگهی استخدام</h2>
<input id="title" placeholder="عنوان شغل">
<input id="city" placeholder="شهر یا ولایت">
<input id="company" placeholder="نام شرکت">
<input id="salary" placeholder="میزان معاش">
<textarea id="description" placeholder="شرح وظایف و شرایط کار"></textarea>
<input id="phone" placeholder="شماره تماس">
<button onclick="addJob()">ثبت آگهی</button>
<p id="message"></p>
</section>

<section id="register" class="card" hidden>
<h2>ثبت‌نام</h2>
<select id="role">
<option>کارجو</option>
<option>کارفرما</option>
</select>
<input id="name" placeholder="نام و نام خانوادگی">
<input id="regCity" placeholder="شهر">
<input id="regPhone" placeholder="شماره تماس">
<input id="skill" placeholder="مهارت یا تخصص">
<button onclick="registerUser()">ثبت‌نام</button>
<p id="regMessage"></p>
</section>
</main>

<footer>کارستان | فرصت برابر برای کار و پیشرفت</footer>

<script>
let jobs=JSON.parse(localStorage.getItem("karistan_jobs")||"[]");

function showPage(id){
["jobs","post","register"].forEach(x=>{
document.getElementById(x).hidden=x!==id;
});
}

function renderJobs(){
let q=document.getElementById("search").value.toLowerCase();
let list=document.getElementById("jobList");
list.innerHTML="";
let filtered=jobs.filter(j=>
(j.title+" "+j.city+" "+j.company).toLowerCase().includes(q)
);
if(!filtered.length){
list.textContent="هنوز آگهی ثبت نشده است.";
return;
}
filtered.forEach(j=>{
let div=document.createElement("div");
div.className="job";
let h=document.createElement("h3");
h.textContent=j.title;
let p=document.createElement("p");
p.textContent="شهر: "+j.city+" | شرکت: "+j.company;
let s=document.createElement("p");
s.textContent="معاش: "+(j.salary||"توافقی");
let d=document.createElement("p");
d.textContent=j.description;
let a=document.createElement("a");
a.textContent="تماس با کارفرما";
a.href="tel:"+j.phone;
div.append(h,p,s,d,a);
list.appendChild(div);
});
}

function addJob(){
let j={
title:document.getElementById("title").value.trim(),
city:document.getElementById("city").value.trim(),
company:document.getElementById("company").value.trim(),
salary:document.getElementById("salary").value.trim(),
description:document.getElementById("description").value.trim(),
phone:document.getElementById("phone").value.trim()
};
if(!j.title||!j.city||!j.phone){
alert("عنوان شغل، شهر و شماره تماس را وارد کنید.");
return;
}
jobs.unshift(j);
localStorage.setItem("karistan_jobs",JSON.stringify(jobs));
document.getElementById("message").textContent="آگهی ثبت شد.";
["title","city","company","salary","description","phone"].forEach(x=>document.getElementById(x).value="");
showPage("jobs");
renderJobs();
}

function registerUser(){
let user={
role:document.getElementById("role").value,
name:document.getElementById("name").value.trim(),
city:document.getElementById("regCity").value.trim(),
phone:document.getElementById("regPhone").value.trim(),
skill:document.getElementById("skill").value.trim()
};
if(!user.name||!user.phone){
alert("نام و شماره تماس را وارد کنید.");
return;
}
let users=JSON.parse(localStorage.getItem("karistan_users")||"[]");
users.push(user);
localStorage.setItem("karistan_users",JSON.stringify(users));
document.getElementById("regMessage").textContent="ثبت‌نام انجام شد.";
}

renderJobs();
</script>
</body>
</html>
